<html lang="az">
<head>

    <style>

        html, body { height: 100%; overflow: hidden; background: #0f172a; }

        #map { height: 100vh; width: 100%; background: #0f172a; }

        /* Üst başlıq */
        .header {
            position: fixed;
            top: 16px;
            left: 16px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 14px 20px;
            z-index: 1000;
            max-width: 340px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .header h1 { font-size: 1.05rem; font-weight: 600; color: #f1f5f9; margin-bottom: 4px; }
        .header p { font-size: 0.75rem; color: #94a3b8; line-height: 1.4; }

        /* Legend */
        .legend {
            position: fixed;
            bottom: 20px;
            left: 16px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px 14px;
            z-index: 1000;
            font-size: 0.75rem;
            color: #cbd5e1;
            display: flex;
            gap: 16px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot {
            width: 12px; height: 12px; border-radius: 50%;
            border: 2px solid;
        }
        .legend-dot.rayon { border-color: #38bdf8; background: rgba(14,165,233,0.7); }
        .legend-dot.seher { border-color: #f59e0b; background: rgba(245,158,11,0.7); }

        /* Tooltip */
        .custom-tooltip {
            background: #1e293b !important;
            color: #e2e8f0 !important;
            border: 1px solid #38bdf8 !important;
            border-radius: 14px !important;
            padding: 14px 18px !important;
            white-space: normal !important;
            max-width: 300px !important;
            min-width: 220px !important;
            box-shadow: 0 12px 36px rgba(0,0,0,0.6) !important;
            font-family: 'Segoe UI', system-ui, sans-serif !important;
            z-index: 9999 !important;
        }
        .custom-tooltip::before { border-top-color: #38bdf8 !important; }
        .tt-basliq { font-size: 1.05rem; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
        .tt-koord { font-size: 0.7rem; color: #64748b; margin-bottom: 10px; }
        .tt-kendler { border-top: 1px solid #334155; padding-top: 8px; margin-top: 6px; }
        .tt-kendler strong { font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 6px; }
        .tt-kend-list {
            font-size: 0.78rem;
            color: #cbd5e1;
            line-height: 1.5;
            max-height: 140px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .tt-kend-list::-webkit-scrollbar { width: 4px; }
        .tt-kend-list::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
        .tt-hint {
            font-size: 0.7rem;
            color: #38bdf8;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #334155;
            font-weight: 500;
        }

        /* Leaflet dark theme */
        .leaflet-container { background: #0f172a !important; }
        .leaflet-control-attribution {
            background: rgba(15,23,42,0.85) !important;
            color: #64748b !important;
            font-size: 0.65rem !important;
        }
        .leaflet-control-attribution a { color: #38bdf8 !important; }
        .leaflet-control-zoom a {
            background: #1e293b !important;
            color: #e2e8f0 !important;
            border-color: #334155 !important;
        }
        .leaflet-control-zoom a:hover { background: #334155 !important; }

        /* Modal */
        .modal-arkaplan {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }
        .modal-arkaplan.acik { display: flex; }
        .modal {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 28px;
            max-width: 640px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalGir 0.25s ease;
        }
        @keyframes modalGir {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-kapat {
            position: absolute; top: 16px; right: 20px;
            background: none; border: none;
            color: #94a3b8; font-size: 1.6rem;
            cursor: pointer; line-height: 1;
        }
        .modal-kapat:hover { color: #f1f5f9; }
        .modal h2 { font-size: 1.4rem; font-weight: 600; color: #f1f5f9; margin-bottom: 4px; }
        .modal .modal-alt { font-size: 0.8rem; color: #64748b; margin-bottom: 18px; }
        .cari-blok {
            display: flex; align-items: center; gap: 20px;
            background: rgba(15,23,42,0.6);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }

        .buyuk-temp span { font-size: 1.2rem; }
        .cari-detay { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 0.85rem; color: #cbd5e1; }
        .etiket { color: #64748b; }
        .bolum-baslik {
            font-size: 0.9rem; font-weight: 600; color: #94a3b8;
            text-transform: uppercase; letter-spacing: 0.5px;
            margin: 20px 0 10px;
        }
        .saatliq-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
        .saatliq-kart {
            min-width: 70px;
            background: rgba(15,23,42,0.6);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            flex-shrink: 0;
        }
        .saatliq-kart .saat { font-size: 0.75rem; color: #64748b; }
        .saatliq-kart .saat-temp { font-size: 1.1rem; font-weight: 500; color: #e2e8f0; margin: 4px 0; }
        .saatliq-kart .saat-yagis { font-size: 0.7rem; color: #38bdf8; }
        .gunluk-list { display: flex; flex-direction: column; gap: 6px; }
        .gunluk-satir {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(15,23,42,0.5);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.85rem;
        }
        .gun-adi { color: #cbd5e1; min-width: 80px; }
        .gun-temp { color: #e2e8f0; font-weight: 500; }
        .gun-yagis { color: #38bdf8; font-size: 0.8rem; }
        .gun-min { color: #64748b; }
        .modal-yuklenir { text-align: center; padding: 40px 20px; color: #94a3b8; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: don 0.7s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes don { to { transform: rotate(360deg); } }
        .modal-xeta { text-align: center; padding: 30px; color: #f87171; }

        @media (max-width: 600px) {
            .header { max-width: calc(100% - 32px); }
            .header h1 { font-size: 0.9rem; }
            .legend { bottom: 12px; left: 12px; font-size: 0.7rem; padding: 8px 10px; }
            .cari-blok { flex-direction: column; align-items: flex-start; }
            .modal { padding: 20px; }
        }
    </style>

            { ad: "Şəmkir", lat: 40.83, lon: 46.02, kendler: ["Dəllər", "Zəyəm", "Qapanlı", "Sabirkənd", "Yeni yol", "Alabaşlı", "Çənlibel", "Düzqışlaq", "Kür", "Morul"] },
            { ad: "Şərur", lat: 39.55, lon: 44.98, kendler: ["Dəmirçi", "Yuxarı Aralıq", "Çomaxtur", "Oğlanqala", "Düdəngə", "Mahmudkənd", "Qarahəsənli", "Yengicə", "Xələc", "Aşağı Yaycı"] },
            { ad: "Şirvan", lat: 39.93, lon: 48.93, seher: true, kendler: ["Bayramlı", "Hacıqəhrəmanlı", "Şəhər mərkəzi"] },
            { ad: "Şuşa", lat: 39.76, lon: 46.75, seher: true, kendler: ["Malıbəyli", "Daşaltı", "Xanalı", "Zarıslı", "Şuşa şəhəri"] },
            { ad: "Tərtər", lat: 40.34, lon: 46.93, kendler: ["Sarıcalı", "Hüseynbəyli", "Azad Qarabağ", "Aşağı Qapanlı", "Yuxarı Qapanlı", "Borsunlu", "Qaradağlı", "Seydimli"] },
            { ad: "Tovuz", lat: 40.99, lon: 45.63, kendler: ["Qovlar", "Düz Cırdaxan", "Əlibəyli", "Bozalqanlı", "Çatax", "Hacıalılı", "Dondar Quşçu", "Aşağı Öysüzlü", "Yuxarı Öysüzlü", "Qədirli"] },
            { ad: "Ucar", lat: 40.52, lon: 47.65, kendler: ["Qarabörk", "Kiçik Məlikli", "Lək", "Türkəci", "Müsüslü", "Bərgüşad", "Qazıqumlaq", "Şahlıq", "Ramal", "Alpout"] },
            { ad: "Xaçmaz", lat: 41.46, lon: 48.80, kendler: ["Nabran", "Qusarçay", "Müqtədir", "Hacılar", "Qımıl", "Yergüc", "Qaradağ Buduq", "Mollaburhanlı", "Əlibəyli", "Armudpadar"] },
            { ad: "Xızı", lat: 40.91, lon: 49.07, kendler: ["Altıağac", "Sitalçay", "Giləzi", "Tıxlı", "Bəyəhmədyurd", "Fındığan", "Ağdərə", "Əmbizlər", "Qarabulaq", "Yarımca"] },
            { ad: "Xocalı", lat: 39.91, lon: 46.79, kendler: ["Ballıca", "Daşbulaq", "Xocalı şəhəri", "Aşağı Yemişcan", "Yuxarı Yemişcan", "Qarabulaq"] },
            { ad: "Xocavənd", lat: 39.79, lon: 47.11, kendler: ["Qırmızı Bazar", "Xocavənd qəs.", "Kuropatkino", "Ağdam yaxınlığı", "Tuğ", "Qaradağlı", "Arakül"] },
            { ad: "Yardımlı", lat: 38.91, lon: 48.24, kendler: ["Hamarkənd", "Çay Üzü", "Şıxımlı", "Bozayran", "Avaş", "Qabaqtəpə", "Çanaqçı", "Yuxarı Astal", "Ərus", "Anzolu"] },
            { ad: "Yevlax", lat: 40.62, lon: 47.15, kendler: ["Qaramanlı", "Səmədabad", "Xaldan", "Hacılar", "Malbinəsi", "Varvara", "Tanrıqulular", "Nemətabad", "Gülövşə", "Aran qəs."] },
            { ad: "Zaqatala", lat: 41.63, lon: 46.64, kendler: ["Çarxana", "Car", "Yuxarı Tala", "Qımır", "Danacı", "Muxax", "Əli Bayramlı", "Yengiyan", "Sumaylı", "Faldarlı"] },
            { ad: "Zəngilan", lat: 39.07, lon: 46.65, kendler: ["Mincivan", "Ağbənd", "Bartaz", "Vənədli", "Xumarlı", "Şərifan", "Məlikli", "Ağalı", "Havzalı"] },
            { ad: "Zərdab", lat: 40.22, lon: 47.71, kendler: ["Şahhüseynli", "Bəyimli", "Dəliqurbanlı", "Məlikli", "Qoruqbağı", "Şıxbağı", "Otmanoba", "Çallı", "Kürəkçay", "Birinci Əlicanlı"] },
            { ad: "Bakı", lat: 40.41, lon: 49.87, seher: true, kendler: ["Xırdalan", "Masazır", "Mərdəkan", "Şüvəlan", "Nardaran", "Buzovna", "Qala", "Türkan", "Hövsan", "Zirə", "Ramana", "Bilgəh", "Pirşağı", "Maştağa", "Bakıxanov", "Əmircan", "Suraxanı", "Lökbatan", "Sahil", "Binə"] },
            { ad: "Gəncə", lat: 40.68, lon: 46.36, seher: true, kendler: ["Hacıkənd", "Zazalı", "Şıxzamanlı", "Bağbanlar", "Nizami qəs.", "Məhsəti qəs."] }
        ];

        // ==================== HAVA KODLARI ====================
        const WEATHER_API = "https://api.open-meteo.com/v1/forecast";

        function havaKoduMetn(kod) {
            const x = { 0:"Aydın",1:"Əsasən aydın",2:"Qismən buludlu",3:"Buludlu",
                45:"Duman",48:"Duman (qırov)",51:"Yüngül çiskin",53:"Orta çiskin",55:"Sıx çiskin",
                61:"Yüngül yağış",63:"Orta yağış",65:"Güclü yağış",71:"Yüngül qar",73:"Orta qar",75:"Güclü qar",
                80:"Yüngül leysan",81:"Orta leysan",82:"Güclü leysan",95:"Tufan",96:"Tufan (dolu)",99:"Güclü tufan" };
            return x[kod] || "Naməlum";
        }
        function havaEmoji(kod) {
            if (kod === 0) return "☀️";
            if (kod === 1 || kod === 2) return "🌤️";
            if (kod === 3) return "☁️";
            if (kod === 45 || kod === 48) return "🌫️";
            if (kod >= 51 && kod <= 55) return "🌦️";
            if (kod >= 61 && kod <= 65) return "🌧️";
            if (kod >= 71 && kod <= 75) return "❄️";
            if (kod >= 80 && kod <= 82) return "🌧️";
            if (kod >= 95) return "⛈️";
            return "🌡️";
        }
        function gunAdi(s) {
            return ["Bazar","Bazar ertəsi","Çərşənbə axşamı","Çərşənbə","Cümə axşamı","Cümə","Şənbə"][new Date(s).getDay()];
        }
        function saatFormat(s) {
            const d = new Date(s);
            return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
        }

        // ==================== XƏRİTƏ ====================
        const map = L.map("map", {
            zoomControl: true,
            preferCanvas: true
        }).setView([40.3, 47.5], 8);

        // Dark tile layer (CartoDB Dark Matter)
        L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
            attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> © <a href="https://carto.com">CartoDB</a>',
            subdomains: "abcd",
            maxZoom: 19
        }).addTo(map);

        // ==================== MARKER-LƏR ====================
        rayonlar.forEach((rayon) => {
            const seherdir = rayon.seher === true;
            const baseRadius = seherdir ? 10 : 7;
            const baseColor = seherdir ? "#f59e0b" : "#38bdf8";
            const baseFill = seherdir ? "#f59e0b" : "#0ea5e9";

            const marker = L.circleMarker([rayon.lat, rayon.lon], {
                radius: baseRadius,
                color: baseColor,
                fillColor: baseFill,
                fillOpacity: 0.7,
                weight: 2
            }).addTo(map);

            const kendler = rayon.kendler || [];
            const kendListHTML = kendler.length
                ? `<div class="tt-kendler">
                     <strong>🏘️ Kəndlər (${kendler.length})</strong>
                     <div class="tt-kend-list">${kendler.join(" · ")}</div>
                   </div>`
                : "";

            const tooltipContent = `
                <div class="tt-basliq">${seherdir ? "🏙️" : "📍"} ${rayon.ad}</div>
                <div class="tt-koord">${rayon.lat.toFixed(2)}°N · ${rayon.lon.toFixed(2)}°E</div>
                ${kendListHTML}
                <div class="tt-hint">Detallı hava durumu üçün klikləyin →</div>
            `;

            marker.bindTooltip(tooltipContent, {
                direction: "top",
                offset: [0, -baseRadius - 4],
                className: "custom-tooltip",
                opacity: 1,
                sticky: false
            });

            marker.on("mouseover", () => {
                marker.setRadius(baseRadius * 2.2);
                marker.setStyle({ fillOpacity: 1, weight: 3 });
                marker.bringToFront();
            });

            marker.on("mouseout", () => {
                marker.setRadius(baseRadius);
                marker.setStyle({ fillOpacity: 0.7, weight: 2 });
            });

            marker.on("click", () => modalAc(rayon));
        });

        // ==================== MODAL (hava durumu) ====================
        const modalArkaplan = document.getElementById("modalArkaplan");
        const modalGovde = document.getElementById("modalGovde");

        document.getElementById("modalKapat").addEventListener("click", modalBagla);
        modalArkaplan.addEventListener("click", (e) => { if (e.target === modalArkaplan) modalBagla(); });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") modalBagla(); });

        function modalBagla() { modalArkaplan.classList.remove("acik"); }

        async function modalAc(rayon) {
            modalArkaplan.classList.add("acik");
            modalGovde.innerHTML = `
                <div class="modal-yuklenir">
                    <div class="spinner"></div>
                    <div>${rayon.ad} üçün hava durumu yüklənir…</div>
                </div>`;

            try {
                const url = `${WEATHER_API}?latitude=${rayon.lat}&longitude=${rayon.lon}` +
                    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,` +
                    `precipitation,weather_code,wind_speed_10m,wind_direction_10m` +
                    `&hourly=temperature_2m,precipitation_probability,weather_code` +
                    `&daily=weather_code,temperature_2m_max,temperature_2m_min,` +
                    `precipitation_probability_max,wind_speed_10m_max` +
                    `&timezone=auto&forecast_days=7`;

                const cavab = await fetch(url);
                if (!cavab.ok) throw new Error("HTTP " + cavab.status);
                const data = await cavab.json();

                modalGovde.innerHTML = modalIcerikYarat(rayon, data);
            } catch (xeta) {
                modalGovde.innerHTML = `
                    <div class="modal-xeta">
                        <div style="font-size:2rem;margin-bottom:10px;">⚠️</div>
                        <div>${rayon.ad} üçün məlumat alına bilmədi.</div>
                        <div style="font-size:0.8rem;margin-top:8px;color:#64748b;">${xeta.message}</div>
                    </div>`;
            }
        }

        function modalIcerikYarat(rayon, data) {
            const c = data.current, h = data.hourly, d = data.daily;
            const temp = Math.round(c.temperature_2m);
            const hiss = Math.round(c.apparent_temperature);
            const kod = c.weather_code;

            let saatliqHTML = "";
            for (let i = 0; i < Math.min(12, h.time.length); i++) {
                saatliqHTML += `
                    <div class="saatliq-kart">
                        <div class="saat">${saatFormat(h.time[i])}</div>
                        <div class="saat-temp">${havaEmoji(h.weather_code[i])} ${Math.round(h.temperature_2m[i])}°</div>
                        <div class="saat-yagis">💧 ${h.precipitation_probability[i]}%</div>
                    </div>`;
            }

            let gunlukHTML = "";
            for (let i = 0; i < d.time.length; i++) {
                gunlukHTML += `
                    <div class="gunluk-satir">
                        <span class="gun-adi">${gunAdi(d.time[i])}</span>
                        <span class="gun-temp">${havaEmoji(d.weather_code[i])} ${Math.round(d.temperature_2m_max[i])}° <span class="gun-min">/ ${Math.round(d.temperature_2m_min[i])}°</span></span>
                        <span class="gun-yagis">💧 ${d.precipitation_probability_max[i]}%</span>
                    </div>`;
            }

            const kendSay = (rayon.kendler || []).length;

            return `
                <h2>${rayon.seher ? "🏙️" : "📍"} ${rayon.ad}</h2>
                <div class="modal-alt">${kendSay} kənd · Yenilənmə: ${new Date().toLocaleTimeString("az-AZ")}</div>

                <div class="cari-blok">
                    <div class="buyuk-temp">${temp}<span>°C</span></div>
                    <div class="cari-detay">
                        <div><span class="etiket">Hiss edilir:</span> ${hiss}°C</div>
                        <div><span class="etiket">Vəziyyət:</span> ${havaEmoji(kod)} ${havaKoduMetn(kod)}</div>
                        <div><span class="etiket">Rütubət:</span> ${c.relative_humidity_2m}%</div>
                        <div><span class="etiket">Külək:</span> ${Math.round(c.wind_speed_10m)} km/s</div>
                        <div><span class="etiket">Yağıntı:</span> ${c.precipitation} mm</div>
                    </div>
                </div>

                <div class="bolum-baslik">⏰ Saatlıq proqnoz</div>
                <div class="saatliq-scroll">${saatliqHTML}</div>

                <div class="bolum-baslik">📅 7 günlük proqnoz</div>
                <div class="gunluk-list">${gunlukHTML}</div>
            `;
        }
    </script>
</body>
</html>
