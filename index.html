<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azerbaycan Rayonları — Hava Durumu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #e2e8f0;
            padding: 24px;
        }
        h1 {
            text-align: center;
            font-weight: 400;
            font-size: 1.8rem;
            margin-bottom: 6px;
            letter-spacing: 1px;
            color: #f1f5f9;
        }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .kart {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 16px 14px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .kart:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.15);
        }
        .kart:active {
            transform: scale(0.98);
        }
        .kart .ad {
            font-size: 1rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .kart .temp {
            font-size: 2rem;
            font-weight: 300;
            color: #38bdf8;
            line-height: 1.2;
        }
        .kart .temp span {
            font-size: 1rem;
            color: #94a3b8;
            font-weight: 400;
        }
        .kart .desc {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .kart .yuklenir {
            font-size: 0.8rem;
            color: #64748b;
            font-style: italic;
        }
        .kart .xeta {
            font-size: 0.8rem;
            color: #f87171;
        }

        /* Modal */
        .modal-arkaplan {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-arkaplan.acik {
            display: flex;
        }
        .modal {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 28px;
            max-width: 640px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalGir 0.25s ease;
        }
        @keyframes modalGir {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-kapat {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.6rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }
        .modal-kapat:hover {
            color: #f1f5f9;
        }
        .modal h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 4px;
        }
        .modal .modal-alt {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 18px;
        }
        .cari-blok {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }
        .cari-blok .buyuk-temp {
            font-size: 3rem;
            font-weight: 300;
            color: #38bdf8;
            line-height: 1;
        }
        .cari-blok .buyuk-temp span {
            font-size: 1.2rem;
        }
        .cari-detay {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .cari-detay .etiket {
            color: #64748b;
        }
        .bolum-baslik {
            font-size: 0.9rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 20px 0 10px;
        }
        .saatliq-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
        }
        .saatliq-kart {
            min-width: 70px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            flex-shrink: 0;
        }
        .saatliq-kart .saat {
            font-size: 0.75rem;
            color: #64748b;
        }
        .saatliq-kart .saat-temp {
            font-size: 1.1rem;
            font-weight: 500;
            color: #e2e8f0;
            margin: 4px 0;
        }
        .saatliq-kart .saat-yagis {
            font-size: 0.7rem;
            color: #38bdf8;
        }
        .gunluk-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .gunluk-satir {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.85rem;
        }
        .gunluk-satir .gun-adi {
            color: #cbd5e1;
            min-width: 80px;
        }
        .gunluk-satir .gun-temp {
            color: #e2e8f0;
            font-weight: 500;
        }
        .gunluk-satir .gun-yagis {
            color: #38bdf8;
            font-size: 0.8rem;
        }
        .gunluk-satir .gun-min {
            color: #64748b;
        }
        .modal-yuklenir {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: don 0.7s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes don {
            to { transform: rotate(360deg); }
        }
        .modal-xeta {
            text-align: center;
            padding: 30px;
            color: #f87171;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.75rem;
            color: #475569;
        }
        @media (max-width: 480px) {
            body { padding: 14px; }
            h1 { font-size: 1.3rem; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
            .kart { padding: 12px 10px; }
            .kart .temp { font-size: 1.5rem; }
            .modal { padding: 20px; }
            .cari-blok { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <h1>🇦🇿 Azerbaycan Rayonları</h1>
    <p class="subtitle">Rayonun üzərinə klikləyin — ətraflı hava durumu açılsın</p>

    <div class="grid" id="grid"></div>

    <div class="footer">Məlumat mənbəyi: Open-Meteo (pulsuz, API açarı tələb etmir)</div>

    <!-- Modal -->
    <div class="modal-arkaplan" id="modalArkaplan">
        <div class="modal" id="modalIcerik">
            <button class="modal-kapat" id="modalKapat">&times;</button>
            <div id="modalGovde"></div>
        </div>
    </div>

    <script>
        // ==================== RAYONLAR VƏ KOORDİNATLAR ====================
        const rayonlar = [
            { ad: "Abşeron", lat: 40.45, lon: 49.75 },
            { ad: "Ağcabədi", lat: 40.05, lon: 47.45 },
            { ad: "Ağdam", lat: 39.99, lon: 46.93 },
            { ad: "Ağdaş", lat: 40.65, lon: 47.48 },
            { ad: "Ağstafa", lat: 41.12, lon: 45.45 },
            { ad: "Ağsu", lat: 40.57, lon: 48.40 },
            { ad: "Astara", lat: 38.45, lon: 48.87 },
            { ad: "Balakən", lat: 41.72, lon: 46.40 },
            { ad: "Bərdə", lat: 40.37, lon: 47.13 },
            { ad: "Beyləqan", lat: 39.77, lon: 47.62 },
            { ad: "Biləsuvar", lat: 39.45, lon: 48.55 },
            { ad: "Cəbrayıl", lat: 39.40, lon: 47.02 },
            { ad: "Cəlilabad", lat: 39.20, lon: 48.50 },
            { ad: "Culfa", lat: 38.96, lon: 45.63 },
            { ad: "Daşkəsən", lat: 40.52, lon: 46.08 },
            { ad: "Füzuli", lat: 39.60, lon: 47.15 },
            { ad: "Gədəbəy", lat: 40.57, lon: 45.82 },
            { ad: "Goranboy", lat: 40.61, lon: 46.79 },
            { ad: "Göyçay", lat: 40.65, lon: 47.74 },
            { ad: "Göygöl", lat: 40.58, lon: 46.32 },
            { ad: "Hacıqabul", lat: 40.04, lon: 48.94 },
            { ad: "İmişli", lat: 39.87, lon: 48.06 },
            { ad: "İsmayıllı", lat: 40.79, lon: 48.15 },
            { ad: "Kəlbəcər", lat: 40.10, lon: 46.04 },
            { ad: "Kürdəmir", lat: 40.34, lon: 48.16 },
            { ad: "Qax", lat: 41.42, lon: 46.92 },
            { ad: "Qazax", lat: 41.09, lon: 45.36 },
            { ad: "Qəbələ", lat: 40.98, lon: 47.85 },
            { ad: "Qobustan", lat: 40.53, lon: 48.93 },
            { ad: "Quba", lat: 41.36, lon: 48.51 },
            { ad: "Qubadlı", lat: 39.34, lon: 46.58 },
            { ad: "Qusar", lat: 41.43, lon: 48.43 },
            { ad: "Laçın", lat: 39.64, lon: 46.55 },
            { ad: "Lənkəran", lat: 38.75, lon: 48.85 },
            { ad: "Lerik", lat: 38.77, lon: 48.41 },
            { ad: "Masallı", lat: 39.03, lon: 48.67 },
            { ad: "Mingəçevir", lat: 40.77, lon: 47.05 },
            { ad: "Naftalan", lat: 40.51, lon: 46.82 },
            { ad: "Naxçıvan", lat: 39.21, lon: 45.41 },
            { ad: "Neftçala", lat: 39.37, lon: 49.24 },
            { ad: "Oğuz", lat: 41.07, lon: 47.46 },
            { ad: "Ordubad", lat: 38.91, lon: 46.02 },
            { ad: "Saatlı", lat: 39.93, lon: 48.37 },
            { ad: "Sabirabad", lat: 39.99, lon: 48.47 },
            { ad: "Salyan", lat: 39.60, lon: 48.98 },
            { ad: "Samux", lat: 40.76, lon: 46.41 },
            { ad: "Siyəzən", lat: 41.08, lon: 49.11 },
            { ad: "Sumqayıt", lat: 40.59, lon: 49.67 },
            { ad: "Şabran", lat: 41.20, lon: 48.99 },
            { ad: "Şəki", lat: 41.19, lon: 47.17 },
            { ad: "Şəmkir", lat: 40.83, lon: 46.02 },
            { ad: "Şərur", lat: 39.55, lon: 44.98 },
            { ad: "Şirvan", lat: 39.93, lon: 48.93 },
            { ad: "Şuşa", lat: 39.76, lon: 46.75 },
            { ad: "Tərtər", lat: 40.34, lon: 46.93 },
            { ad: "Tovuz", lat: 40.99, lon: 45.63 },
            { ad: "Ucar", lat: 40.52, lon: 47.65 },
            { ad: "Xaçmaz", lat: 41.46, lon: 48.80 },
            { ad: "Xızı", lat: 40.91, lon: 49.07 },
            { ad: "Xocalı", lat: 39.91, lon: 46.79 },
            { ad: "Xocavənd", lat: 39.79, lon: 47.11 },
            { ad: "Yardımlı", lat: 38.91, lon: 48.24 },
            { ad: "Yevlax", lat: 40.62, lon: 47.15 },
            { ad: "Zaqatala", lat: 41.63, lon: 46.64 },
            { ad: "Zəngilan", lat: 39.07, lon: 46.65 },
            { ad: "Zərdab", lat: 40.22, lon: 47.71 }
        ];

        // ==================== KÖMƏKÇİ FUNKSİYALAR ====================
        const WEATHER_API = "https://api.open-meteo.com/v1/forecast";

        // WMO hava kodlarını Azərbaycan dilinə çevir
        function havaKoduMetn(kod) {
            const xəritə = {
                0: "Aydın", 1: "Əsasən aydın", 2: "Qismən buludlu", 3: "Buludlu",
                45: "Duman", 48: "Duman (qırov)",
                51: "Yüngül çiskin", 53: "Orta çiskin", 55: "Sıx çiskin",
                61: "Yüngül yağış", 63: "Orta yağış", 65: "Güclü yağış",
                71: "Yüngül qar", 73: "Orta qar", 75: "Güclü qar",
                80: "Yüngül leysan", 81: "Orta leysan", 82: "Güclü leysan",
                95: "Tufan", 96: "Tufan (dolu ilə)", 99: "Güclü tufan (dolu ilə)"
            };
            return xəritə[kod] || "Naməlum";
        }

        // Hava koduna uyğun emoji
        function havaEmoji(kod) {
            if (kod === 0) return "☀️";
            if (kod === 1 || kod === 2) return "🌤️";
            if (kod === 3) return "☁️";
            if (kod === 45 || kod === 48) return "🌫️";
            if (kod >= 51 && kod <= 55) return "🌦️";
            if (kod >= 61 && kod <= 65) return "🌧️";
            if (kod >= 71 && kod <= 75) return "❄️";
            if (kod >= 80 && kod <= 82) return "🌧️";
            if (kod >= 95) return "⛈️";
            return "🌡️";
        }

        // Gün adını Azərbaycanca qaytar
        function gunAdi(tarixStr) {
            const gunler = ["Bazar", "Bazar ertəsi", "Çərşənbə axşamı", "Çərşənbə", "Cümə axşamı", "Cümə", "Şənbə"];
            const d = new Date(tarixStr);
            return gunler[d.getDay()];
        }

        // Saatı formatla
        function saatFormat(isoStr) {
            const d = new Date(isoStr);
            return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
        }

        // ==================== KARTLARI YARAT ====================
        const grid = document.getElementById("grid");

        rayonlar.forEach((rayon, index) => {
            const kart = document.createElement("div");
            kart.className = "kart";
            kart.dataset.index = index;
            kart.innerHTML = `
                <div class="ad">${rayon.ad}</div>
                <div class="yuklenir" id="kart-${index}">Yüklənir…</div>
            `;
            kart.addEventListener("click", () => modalAc(rayon));
            grid.appendChild(kart);
        });

        // ==================== KARTLAR ÜÇÜN QISA HAVA MƏLUMATI ====================
        async function kartlariYukle() {
            // Hər rayon üçün ayrı-ayrı sorğu göndərmək əvəzinə,
            // Open-Meteo çoxməkan dəstəyindən istifadə edirik (comma-separated).
            // Lakin kartlar üçün sadəcə cari temperatur kifayətdir, ona görə
            // hər birini fərdi yükləyirik (kiçik sorğular, paralel).
            const veadlər = rayonlar.map((r, i) => kartYukle(r, i));
            await Promise.allSettled(veadlər);
        }

        async function kartYukle(rayon, index) {
            const el = document.getElementById(`kart-${index}`);
            if (!el) return;
            try {
                const url = `${WEATHER_API}?latitude=${rayon.lat}&longitude=${rayon.lon}` +
                    `&current=temperature_2m,weather_code` +
                    `&timezone=auto`;
                const cavab = await fetch(url);
                if (!cavab.ok) throw new Error("HTTP " + cavab.status);
                const data = await cavab.json();
                const cari = data.current;
                const temp = Math.round(cari.temperature_2m);
                const kod = cari.weather_code;
                el.outerHTML = `
                    <div class="temp">${temp}<span>°C</span></div>
                    <div class="desc">${havaEmoji(kod)} ${havaKoduMetn(kod)}</div>
                `;
            } catch (xeta) {
                el.outerHTML = `<div class="xeta">⚠ Məlumat alınmadı</div>`;
            }
        }

        // ==================== MODAL ====================
        const modalArkaplan = document.getElementById("modalArkaplan");
        const modalGovde = document.getElementById("modalGovde");
        const modalKapat = document.getElementById("modalKapat");

        modalKapat.addEventListener("click", modalBagla);
        modalArkaplan.addEventListener("click", (e) => {
            if (e.target === modalArkaplan) modalBagla();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") modalBagla();
        });

        function modalBagla() {
            modalArkaplan.classList.remove("acik");
        }

        async function modalAc(rayon) {
            modalArkaplan.classList.add("acik");
            modalGovde.innerHTML = `
                <div class="modal-yuklenir">
                    <div class="spinner"></div>
                    <div>${rayon.ad} rayonu üçün hava durumu yüklənir…</div>
                </div>
            `;

            try {
                const url = `${WEATHER_API}?latitude=${rayon.lat}&longitude=${rayon.lon}` +
                    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,` +
                    `precipitation,weather_code,wind_speed_10m,wind_direction_10m` +
                    `&hourly=temperature_2m,precipitation_probability,weather_code` +
                    `&daily=weather_code,temperature_2m_max,temperature_2m_min,` +
                    `precipitation_probability_max,wind_speed_10m_max` +
                    `&timezone=auto&forecast_days=7`;

                const cavab = await fetch(url);
                if (!cavab.ok) throw new Error("HTTP " + cavab.status);
                const data = await cavab.json();

                modalGovde.innerHTML = modalIcerikYarat(rayon, data);
            } catch (xeta) {
                modalGovde.innerHTML = `
                    <div class="modal-xeta">
                        <div style="font-size:2rem;margin-bottom:10px;">⚠️</div>
                        <div>${rayon.ad} rayonu üçün məlumat alına bilmədi.</div>
                        <div style="font-size:0.8rem;margin-top:8px;color:#64748b;">${xeta.message}</div>
                    </div>
                `;
            }
        }

        function modalIcerikYarat(rayon, data) {
            const cari = data.current;
            const hourly = data.hourly;
            const daily = data.daily;

            const temp = Math.round(cari.temperature_2m);
            const hiss = Math.round(cari.apparent_temperature);
            const nem = cari.relative_humidity_2m;
            const yagis = cari.precipitation;
            const kulək = Math.round(cari.wind_speed_10m);
            const kuləkIst = cari.wind_direction_10m;
            const kod = cari.weather_code;

            // Saatlıq: növbəti 12 saat
            const indi = new Date();
            let saatliqHTML = "";
            const saatSayi = Math.min(12, hourly.time.length);
            for (let i = 0; i < saatSayi; i++) {
                const t = new Date(hourly.time[i]);
                // Yalnız cari saatdan sonrakıları göstər (sadəlik üçün ilk 12)
                const saatTemp = Math.round(hourly.temperature_2m[i]);
                const yagisEht = hourly.precipitation_probability[i];
                const saatKod = hourly.weather_code[i];
                saatliqHTML += `
                    <div class="saatliq-kart">
                        <div class="saat">${saatFormat(hourly.time[i])}</div>
                        <div class="saat-temp">${havaEmoji(saatKod)} ${saatTemp}°</div>
                        <div class="saat-yagis">💧 ${yagisEht}%</div>
                    </div>
                `;
            }

            // Günlük: 7 gün
            let gunlukHTML = "";
            for (let i = 0; i < daily.time.length; i++) {
                const gun = gunAdi(daily.time[i]);
                const max = Math.round(daily.temperature_2m_max[i]);
                const min = Math.round(daily.temperature_2m_min[i]);
                const yagisEht = daily.precipitation_probability_max[i];
                const gunKod = daily.weather_code[i];
                gunlukHTML += `
                    <div class="gunluk-satir">
                        <span class="gun-adi">${gun}</span>
                        <span class="gun-temp">${havaEmoji(gunKod)} ${max}° <span class="gun-min">/ ${min}°</span></span>
                        <span class="gun-yagis">💧 ${yagisEht}%</span>
                    </div>
                `;
            }

            return `
                <h2>${rayon.ad} rayonu</h2>
                <div class="modal-alt">Koord: ${rayon.lat.toFixed(2)}°N, ${rayon.lon.toFixed(2)}°E · Yenilənmə: ${new Date().toLocaleTimeString("az-AZ")}</div>

                <div class="cari-blok">
                    <div class="buyuk-temp">${temp}<span>°C</span></div>
                    <div class="cari-detay">
                        <div><span class="etiket">Hiss edilir:</span> ${hiss}°C</div>
                        <div><span class="etiket">Vəziyyət:</span> ${havaEmoji(kod)} ${havaKoduMetn(kod)}</div>
                        <div><span class="etiket">Rütubət:</span> ${nem}%</div>
                        <div><span class="etiket">Külək:</span> ${kulək} km/s (${kuləkIst}°)</div>
                        <div><span class="etiket">Yağıntı:</span> ${yagis} mm</div>
                    </div>
                </div>

                <div class="bolum-baslik">⏰ Saatlıq proqnoz (növbəti 12 saat)</div>
                <div class="saatliq-scroll">${saatliqHTML}</div>

                <div class="bolum-baslik">📅 7 günlük proqnoz</div>
                <div class="gunluk-list">${gunlukHTML}</div>
            `;
        }

        // ==================== BAŞLAT ====================
        kartlariYukle();
    </script>
</body>
  </html>
